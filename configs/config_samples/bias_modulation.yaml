method_name: bias_modulation
output_dir: results/heart/bias_modulation/
seed_everything: 42
model:
  class_path: models.bias_modulation.BiasModulated
  init_args:
    input_dim: 11
    output_dim: 2
    hidden_layers: [32, 32]
    activation: relu
    dropout: 0.5
    learning_rate: 0.001
    weight_decay: 0.0001
    nb_groups: 4 
    head_weights: [1, 1]  # Weights for sensitive attributes classification. 
    modulated_layers_indices: [0, 1]  # Indices of layers to apply bias modulation
    modulated_at_inference: false  # Whether to apply bias modulation at inference time
    remove_bias_in_linear_layers: false  # Whether to remove bias terms in linear layers
data:
  class_path: dataloaders.heart.Heart
  init_args:
    batch_size: 32
    num_workers: 4
    pin_memory: false 
    sensitive_attr: ['sex', 'age']  # Intersectional sensitive attributes
    is_1hot: false
    is_intersectional: false
    is_decoupled: false

trainer:
  max_epochs: 500
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 1 
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        dirpath: logs/heart_experiment/bias_modulation/checkpoints/
        filename: best-checkpoint 
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 20
        mode: min
        min_delta: 0.0001
        verbose: false  

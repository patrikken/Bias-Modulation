data_name: ACS_PUMS_income
output_dir: results/acs_pums/
model:
  input_dim: 9
  output_dim: 2
  hidden_layers: [32, 32]
  activation: relu
  dropout: 0.5
  learning_rate: 0.001
  weight_decay: 0.0001 
data:
  class_path: dataloaders.acs_pums.ACSPums
  init_args:
    batch_size: 64
    num_workers: 4
    pin_memory: false
    sensitive_attr_name: SEX
    acs_task: income
    states: ["AL"]
    survey_year: 2018
    horizon: "1-Year"

trainer:
  max_epochs: 100
  accelerator: cpu
  devices: 1
  val_check_interval: 5
  log_every_n_steps: 1
  logger:  
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        name: acs_pums/income
        save_dir: logs/wandb/acs_pums_income
        project: fair_neural_methods
        entity: patrikj-kenfack-ets  # Replace with your actual WandB entity
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        dirpath: logs/adult_experiment/checkpoints/
        filename: best-checkpoint 
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 5
        mode: min
        verbose: true  

data_name: adult
output_dir: results/adult/
model:
  input_dim: 96
  output_dim: 2
  hidden_layers: [32, 32]
  activation: relu
  dropout: 0.5
  learning_rate: 0.001
  weight_decay: 0.0001 
data:
  class_path: dataloaders.adult.Adult
  init_args:
    batch_size: 64
    num_workers: 4
    pin_memory: false
    sensitive_attr_name: sex

trainer:
  max_epochs: 100
  accelerator: cpu
  devices: 1
  val_check_interval: 10
  log_every_n_steps: 10
  logger: 
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        name: adult/sex
        save_dir: logs/wandb/adult_sex
        project: fair_neural_methods
        entity: patrikj-kenfack-ets  # Replace with your actual WandB entity
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        dirpath: logs/adult_experiment/checkpoints/
        filename: best-checkpoint 
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 5
        mode: min
        verbose: true  

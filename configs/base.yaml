method_name: generic
output_dir: results/heart/generic/
seed_everything: 42
model:
  class_path: models.generic.GenericModel
  init_args:
    input_dim: 11
    output_dim: 2
    hidden_layers: [32, 32, 32, 32]
    activation: relu
    dropout: 0.5
    learning_rate: 0.001
    weight_decay: 0.0001 
data:
  class_path: dataloaders.heart.Heart
  init_args:
    batch_size: 32
    num_workers: 4
    pin_memory: false 
    sensitive_attr: ['sex', 'age']  # Intersectional sensitive attributes
    is_1hot: false
    is_intersectional: false
    is_decoupled: false

trainer:
  max_epochs: 300
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 1 
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 25
        mode: min
        min_delta: 0.001
        verbose: false 
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        dirpath: logs/heart_experiment/generic/checkpoints/
        filename: best-checkpoint 
     
